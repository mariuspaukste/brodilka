name: Build & deploy (Rust → WASM → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown --lib
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test the wasm
        run: node tools/smoke.mjs target/wasm32-unknown-unknown/release/brodilka.wasm
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r web/* dist/
          cp target/wasm32-unknown-unknown/release/brodilka.wasm dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
