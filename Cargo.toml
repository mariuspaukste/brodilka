[package]
name = "brodilka"
version = "0.1.0"
edition = "2021"
description = "Brodilka - a small Ultima Online-style sandbox RPG in Rust/WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
