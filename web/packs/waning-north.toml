# The Waning North: an original world for brodilka.
#
# An old northern kingdom in its last age. A grey pestilence has emptied
# half the farms, the Witch-realm of Vathmor sends its orcs over the fells,
# and something cold has woken in the burial howes. Thornmere stands at
# the crossroads; the King still holds Caer Ardun to the north.
#
# Ships with the game: pick it on the title screen under "World".

[pack]
id = "waning-north"
name = "The Waning North"
subtitle = "The last age of the kingdom of Ardun"
seed = 640

# ------------------------------------------------------------------ the living world
# The calendar, the power beyond the map and the dark places on it. Each
# place has a strength 0-100: it sets how many of its creatures roam. Slaying
# them weakens the place and, a little, the power behind it; left alone, a
# place grows back toward that power's strength. drift is tenths of a point
# a day, so Vathmor gains a point every two and a half days.
[sim]
start = "640-03-01"
era = "W.Y."
months = [
  "Frostmonth", "Snowmonth", "Thawmonth", "Seedmonth", "Bloommonth", "Hayingmonth",
  "Midsummer", "Harvestmonth", "Reapmonth", "Leafturn", "Bloodmonth", "Yulemonth",
]

[region.vathmor]
name = "the Witch-realm of Vathmor"
strength = 62
drift = 4
min = 20
# its places darken the land around them, further as it grows
shadow = true
rise = "Riders bring word: {name} gathers its strength in the north."
fall = "The Roadwardens say {name} is shaken. Its fires burn lower on the fells."

[site.graveyard]
region = "vathmor"
strength = 55
rise = "Cold lights burn brighter over {name}. The dead are rising."
fall = "Fewer lights over {name} tonight."
raid = "The dead have left {name}. They walk the road toward {town}!"
hit = "The dead from {name} came to the farms outside {town}. No one there will speak of the night."
broken = "The dead that walked from {name} lie still again."

[site.orcs]
region = "vathmor"
rise = "Smoke over the south-west: more orcs have come to {name}."
fall = "{name} has lost many of its orcs. They will be back."
raid = "Horns in the south-west: a warband marches from {name} on {town}!"
hit = "Orcs from {name} burned the farms outside {town} and drove off the cattle."
broken = "The warband from {name} was cut down on the road. Vathmor will hear of it."

[site.hills]
region = "vathmor"
strength = 45
rise = "Drovers on the Northway speak of trolls coming down from {name}."
fall = "The trolls of {name} keep to their caves."
raid = "Trolls are coming down from {name} toward {town}!"
hit = "Trolls from {name} smashed the barns outside {town}."
broken = "The trolls that came down from {name} will not go back."

[site.lair]
base = 70
regrow = 3
rise = "The ground shakes in the south-east. The drake stirs in {name}."

[site.wilds]
base = 45
rise = "Wolves howl close to the hedge at night."
fall = "The woods are quieter. Game is easier to find."

