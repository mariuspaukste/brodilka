# The Waning North: an original world for brodilka.
#
# An old northern kingdom in its last age. A grey pestilence has emptied
# half the farms, the Witch-realm of Vathmor sends its orcs over the fells,
# and something cold has woken in the burial howes. Thornmere stands at
# the crossroads; the King still holds Caer Ardun to the north.
#
# Ships with the game: pick it on the title screen under "World".

[pack]
id = "waning-north"
name = "The Waning North"
subtitle = "The last age of the kingdom of Ardun"
seed = 640

