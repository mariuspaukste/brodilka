# ------------------------------------------------------------------ the folk of Thornmere and Caer Ardun
[vendor.smith]
title = "the smith"
names = ["Will Pickering", "Harry Sandford", "Ada Rushby"]
chatter = [
  "Good steel, forged this very morn!",
  "Bring me ingots from the Greyspine and I shall pay fair coin.",
  "Smelt thine ore at my forge, friend.",
  "The Dwarves passing on the Road pay well for a sharp edge.",
]

[vendor.mage]
title = "the loremaster"
names = ["Maelis", "Orwen", "Isaund"]
chatter = [
  "Herbs and old words, for those with the wit to use them.",
  "Heal-all, they say, works best in a steady hand.",
  "Practise the old words and thy lore shall grow.",
  "These words were old when Ardun was young.",
]
robe = "#3a4a6a"

[vendor.provisioner]
title = "the provisioner"
names = ["Tom Applegarth", "Nell Thistleby", "Bill Heathcote"]
chatter = [
  "Bandages, tools, all a traveller on the Road needs.",
  "The Hartwood is thick with timber.",
  "Fish from the Wend fetch a good price.",
]

[vendor.healer]
title = "the herb-wife"
names = ["Mother Brackley", "Old Marlow"]
chatter = [
  "Should death find thee, seek me out.",
  "Bandages mend the flesh, if thy hand be steady.",
  "The old waystones of Ardun can call back the fallen.",
  "Half of Thornmere was buried after the Pestilence. I mended the other half.",
]

[vendor.banker]
title = "the moneylender"
names = ["Ned Underwood", "Rose Hollins"]
chatter = [
  "Thy coin is safe with me. Safer than on the Road.",
  "Carry less, lose less, as they say in the hill-farms.",
  "Deposits and withdrawals, friend.",
]

[vendor.guard]
title = "the watchman"
names = ["Sam Rushby", "Ted Pickering", "Wat Underwood"]
chatter = [
  "All quiet on the Road.",
  "Keep thy blade sheathed within Thornmere.",
  "Cold lights burn over the howes to the north-east.",
  "Orcs of Vathmor have made camp in the south-west.",
  "Trolls roam the Grimfells to the north-west.",
  "They say a fire-drake sleeps in the south-east.",
]

[vendor.folk]
names = [
  "Old Tam",
  "Mirela Heathcote",
  "Joss",
  "Widow Agna",
  "Pell Applegarth",
  "Hanne",
  "Corwin Hollins",
  "Ilse",
  "Brother Aldo",
  "Fen Underwood",
]
chatter = [
  "The bell tolls for another burial today.",
  "Bar thy door after dark, stranger.",
  "My son went north to fight for the King. He has not come back.",
  "Roadwardens in the common-room again. Grim folk, but they keep the Road.",
  "Bread costs twice what it did before the Pestilence.",
  "The dead walk on the howes. I have seen the lights.",
  "Stay off the Road at night.",
  "Vathmor sends its wolves further south every winter.",
]

[vendor.barkeep]
title = "the innkeeper"
names = ["Barnaby Hollins", "Hilda Hollins", "Wat Marlow"]
chatter = [
  "A pint's a copper or three. Sit, warm thy bones.",
  "A drover swore he saw the dead walking the Northway.",
  "The orcs pay no tithe, and want no ale. Ill-mannered folk.",
  "Last fool who went for the drake's gold drank here first.",
  "Pay before thou drinkest. House rule since my grandfather's day.",
  "Hill-folk, river-folk, wardens: all are welcome at the Hart.",
]

[vendor.librarian]
title = "the keeper of records"
names = ["Erelas the Scribe", "Mistress Pickering", "Anselm"]
chatter = [
  "Hush. These are the chronicles of Ardun.",
  "The Howe-king was a lord of the old kingdom once, they say. Mind thy studies.",
  "The day turns from Dawn to Night, as it ever has.",
  "Bring me scrolls thou hast found. I pay for knowledge.",
  "Old words learnt from a scroll are never forgot.",
]

[vendor.lord]
title = "of Caer Ardun"
names = ["Lord Aranthor", "Lady Eldaneth", "Lord Corvane"]
chatter = [
  "Kneel, or state thy business at the King's court.",
  "The howes have stirred since the Pestilence. Lay the dead to rest.",
  "Vathmor's orcs raid my lands from the south-west. Bring me their captain's head.",
  "Within these walls the King's peace holds. Beyond, thou art alone.",
  "Slay the drake, and all Ardun will sing thy name.",
  "The fell-trolls grow bold upon the Grimfells. Thin their number.",
]
robe = "#2a2a3a"

[vendor.villager]
# the little folk of Hollowbrook, in their burrows behind the hedge
names = [
  "Pip Thistlebrook", "Daisy Hollowell", "Barnaby Mossfoot", "Clover Puddleby",
  "Tobin Fernbank", "Wren Applethorn", "Bramble Sweetwater", "Nell Underbough",
  "Ollie Hedgerow", "Poppy Fairbrook",
]
chatter = [
  "Fine weather for the garden.",
  "The mill-wheel on the Wend has turned since before my grandmother's time.",
  "Mind the cabbages, if you please!",
  "Nothing ever happens in Hollowbrook, and that's just how we like it.",
  "Big Folk from Thornmere? You'll be wanting the Jolly Miller, I expect.",
  "There's to be a party under the Midsummer Oak, and everyone's asked.",
  "The hedge keeps out the wolves, and the hayward keeps out the rest.",
  "Elevenses! Is it elevenses already?",
  "Orcs? Vathmor? Not here, thank you. We've a garden to see to.",
  "A pipe, a good chair and a window on the river. What more is there?",
]

[vendor.stablemaster]
title = "the stablemaster"
names = ["Edda Applegarth", "Garric Heathcote", "Wynn"]
chatter = [
  "A good horse outruns any wolf on the Road.",
  "Tap thy horse to mount. Tap thyself to get down.",
  "Lost thy horse? I'll send the lad to fetch it home.",
  "Wild horses run the western meadows. Leave them be.",
  "A heavy blow will throw thee from the saddle. Hold on tight.",
]

[vendor.stallholder]
# the market folk of Caer Ardun's square; each is named for their stall
names = [
  "Edda Brightwell", "Hob Tallow", "Marn of the Ford", "Tilda Crookshank", "Osric Pennyweather",
  "Brenna Saltmarsh", "Col Fairweather", "Sabine Dunmore", "Aldo Whitlock", "Greta Barrowfield",
]
chatter = [
  "Market day in Caer Ardun! Best prices in the North.",
  "Come closer, come and see!",
  "All fresh, all honest, all cheap.",
  "The caravans bring the salt; we bring the rest.",
]

